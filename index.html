<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WEC Game</title>
<meta name="description" content="WEC Game: multi-class endurance racing at Spa-Francorchamps with Hypercar and LMGT3 cars.">
<link rel="preconnect" href="https://cdnjs.cloudflare.com"><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
:root{color-scheme:dark;--bg:#0b0e12;--fg:#e8edf2;--mut:#8a97a6;--red:#e4002b;--org:#ff8a00;--pn:#141a22}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}#c{z-index:1;pointer-events:none}.ov{z-index:5}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.85);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);overflow:auto}
.card{background:var(--pn);border:1px solid #26303c;border-radius:12px;padding:24px 28px;max-width:470px;width:100%}
h1{margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:.01em}
p,small{color:var(--mut);font-size:13px;line-height:1.5;margin:6px 0}
.row{display:flex;gap:8px;margin:14px 0 6px}
button,select{font:inherit;color:var(--fg);background:#1d2630;border:1px solid #33414f;border-radius:8px;padding:10px 14px;cursor:pointer}
.row button{flex:1;font-weight:700}
.row button.on[data-c="0"]{background:var(--red);border-color:var(--red)}
.row button.on[data-c="1"]{background:var(--org);border-color:var(--org);color:#111}
#pcard{max-width:340px;text-align:center}
.pbtns{display:grid;gap:8px;margin:14px 0 6px}
.pbtns button{padding:12px;font-weight:700}
#presume{background:var(--red);border-color:var(--red)}
#tcard{max-width:520px}
#tlist{display:grid;gap:8px;margin:10px 0}
.trkb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;background:#1a222c}
.trkb span{color:var(--mut);font-size:12px}
.trkb.sel{border-color:#fff;background:#26313d}
#tgo{background:var(--red);border-color:var(--red);font-weight:800;padding:10px 28px}
#mcard{max-width:980px}
#clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;max-height:min(58vh,520px);overflow:auto;margin:12px 0 8px;padding-right:4px;align-content:start}
.team{background:#10161d;border:1px solid #232d38;border-radius:10px;padding:8px}
.team h3{margin:0 0 6px;padding:0 4px;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .cars{display:grid;gap:5px}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.mbar label{color:var(--mut);font-size:13px}
#go{background:var(--red);border-color:var(--red);font-weight:800;padding:10px 28px}
#clist button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;font-size:13px;background:#1a222c}
#clist button .sw{width:6px;align-self:stretch;border-radius:3px;flex:none}
#clist button .no{font-weight:800;min-width:38px}
#clist button .tm{flex:1;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clist button .tag{font-size:10px;font-weight:700;color:#111;background:#9fd3ff;border-radius:4px;padding:2px 5px}
#clist button.sel{border-color:#fff;background:#26313d}
#clist button.sel .tm{color:var(--fg)}
#res .card{display:flex;flex-direction:column;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px)}
#rtabs{display:flex;gap:8px;margin:10px 0 4px}
#rtabs button{flex:1;font-weight:700}
#rtabs button.on[data-c="0"]{background:var(--red);border-color:var(--red)}
#rtabs button.on[data-c="1"]{background:var(--org);border-color:var(--org);color:#111}
#tbl{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tbl thead th{position:sticky;top:0;background:var(--pn);color:var(--mut);font-size:11px;font-weight:700;text-align:left;padding:5px 6px;border-bottom:1px solid #26303c}
#tbl tr.me td{background:#26313d;font-weight:700}
#go,#again{width:100%;margin-top:14px;background:#fff;color:#111;font-weight:800}
#ld{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);transition:opacity .5s}
#ld.done{opacity:0;pointer-events:none}
#ld .ldc{width:100%;max-width:420px;text-align:center}
#ldb{position:relative;height:10px;margin:22px 0 10px;background:#1d2630;border-radius:6px;overflow:hidden}
#ldf{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--red),var(--org));border-radius:6px;transition:width .25s ease-out;overflow:hidden}
#ldf::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:ldsh 1.1s linear infinite}
@keyframes ldsh{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#ldt{color:var(--fg);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}td{padding:5px 6px;border-bottom:1px solid #26303c}
</style></head><body>
<canvas id="c"></canvas>
<div id="ld"><div class="ldc"><h1>WEC Game</h1><div id="ldb"><i id="ldf"></i></div><div id="ldt">Building track and scenery...</div><small id="ldp">0%</small></div></div>
<script>
window.LD={set(p,t){p=Math.max(0,Math.min(1,p));document.getElementById('ldf').style.width=(p*100)+'%';document.getElementById('ldp').textContent=Math.round(p*100)+'%';if(t)document.getElementById('ldt').textContent=t},
 done(){const e=document.getElementById('ld');e.classList.add('done');setTimeout(()=>e.style.display='none',600)}};
LD.set(.05);
</script>
<div class="ov" id="trk" style="display:none"><div class="card" id="tcard">
<small>Select track</small>
<div id="tlist"><button class="trkb" data-t="spa"><b>Spa-Francorchamps</b><span>Belgium · 7.0 km</span></button><!--IMOLA-BUTTON <button class="trkb" data-t="imola"><b>Autodromo Enzo e Dino Ferrari (Imola)</b><span>Italy · 4.9 km</span></button> --></div>
<div class="mbar"><span></span><button id="tgo">Continue</button></div>
</div></div>
<div class="ov" id="menu" style="display:none"><div class="card" id="mcard">
<div class="row"><button data-c="0" class="on">Hypercar</button><button data-c="1">LMGT3</button></div>
<div id="clist"></div>
<div class="mbar"><button id="back">Back</button><label>Race length <select id="laps"><option value="2">2 laps</option><option value="3" selected>3 laps</option><option value="5">5 laps</option><option value="10">10 laps</option></select></label><button id="go">Start race</button></div>
</div></div>
<div class="ov" id="pause" style="display:none"><div class="card" id="pcard"><h1>Paused</h1><div class="pbtns"><button id="presume">Resume</button><button id="prestart">Restart race</button><button id="pquit">Quit to menu</button></div><p>Press Esc or P to resume.</p></div></div>
<div class="ov" id="res" style="display:none"><div class="card"><h1>Chequered flag</h1><div id="rtabs"></div><div id="tbl"></div><button id="again">Race again</button></div></div>

 // pressing Start before every car has arrived waits for them (with progress), then starts
 const go=$('go'),startNow=startRace;
 go.onclick=()=>{
  if(!pending().length){startNow();return}
  go.disabled=true;let t0=Date.now(),done=false;
  const show=()=>{const n=allFiles.length,left=pending().length;go.textContent='Loading cars '+(n-left)+'/'+n+'...';
   if(!done&&(left===0||Date.now()-t0>25000)){done=true;waitBtn=null;go.disabled=false;go.textContent='Start race';startNow()}};
  waitBtn=show;show();const iv=setInterval(()=>{if(done)clearInterval(iv);else show()},300);
  pending().forEach(f=>{loadModel(f)})};
 // choosing a car in the menu loads its model straight away if it is not here yet
 window.__prio=f=>{if(f&&fr[f]<1)loadModel(f)}}
};
requestAnimationFrame(()=>setTimeout(()=>{try{window.__boot()}catch(e){console.error(e);LD.set(0,'Failed to start: '+e.message)}},40));
</script></body></html>
